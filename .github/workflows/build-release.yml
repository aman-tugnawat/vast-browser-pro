name: Build & Release

on:
  # Trigger on push to main branch (including merged engine-update PRs
  # created by the version-check workflow)
  push:
    branches: [ main ]

  # Manual trigger
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version upgrade type'
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write

# Cancel superseded builds of the same ref
concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & publish signed APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify release credentials are configured
        run: |
          if [ -z "${{ secrets.RELEASE_REPO_TOKEN }}" ]; then
            echo "::error::RELEASE_REPO_TOKEN secret is not set (fine-grained PAT with contents:write on MangoDevelopers/vast-browser-release)"
            exit 1
          fi
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set"
            exit 1
          fi

      - name: Bump version (major.minor.patch)
        id: version
        run: |
          # Manual runs choose the bump type; push-triggered builds default to patch.
          # Every release increments the version at least at patch level.
          BUMP="${{ github.event.inputs.bump || 'patch' }}"

          CURRENT=$(grep -oP 'versionName = "\K[^"]+' VastBrowser/vast-browser/build.gradle.kts)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
            *) echo "::error::Unknown bump type: $BUMP"; exit 1 ;;
          esac
          NEW_VERSION="$MAJOR.$MINOR.$PATCH"

          for f in VastBrowser/vast-browser/build.gradle.kts VastBrowser/vast-browser-pro/build.gradle.kts; do
            CODE=$(grep -oP 'versionCode = \K[0-9]+' "$f")
            sed -i "s/versionCode = [0-9]\+/versionCode = $((CODE + 1))/" "$f"
            sed -i "s/versionName = \"[^\"]*\"/versionName = \"$NEW_VERSION\"/" "$f"
          done
          grep -H 'versionCode\|versionName' VastBrowser/vast-browser/build.gradle.kts VastBrowser/vast-browser-pro/build.gradle.kts

          ENGINE=$(grep -oP 'val mozComponentsVersion = "\K[^"]+' VastBrowser/vast-browser/build.gradle.kts)
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "engine=$ENGINE" >> $GITHUB_OUTPUT
          echo "Bump: $BUMP — $CURRENT → $NEW_VERSION (engine: $ENGINE)"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Decode release keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "VAST_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> $GITHUB_ENV

      - name: Grant execute permission to gradlew
        run: chmod +x VastBrowser/gradlew

      - name: Build signed Release APKs
        working-directory: VastBrowser
        env:
          VAST_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VAST_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: ./gradlew assembleRelease

      - name: Collect APKs with stable names
        run: |
          mkdir -p dist
          for f in VastBrowser/vast-browser/build/outputs/apk/release/*.apk; do
            abi=$(basename "$f" | sed -E 's/^vast-browser-(.*)-release\.apk$/\1/')
            cp "$f" "dist/VastBrowser-${abi}.apk"
          done
          for f in VastBrowser/vast-browser-pro/build/outputs/apk/release/*.apk; do
            abi=$(basename "$f" | sed -E 's/^vast-browser-pro-(.*)-release\.apk$/\1/')
            cp "$f" "dist/VastBrowser-Pro-${abi}.apk"
          done
          cd dist && sha256sum *.apk > SHA256SUMS.txt
          ls -la

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VastBrowser/vast-browser/build.gradle.kts VastBrowser/vast-browser-pro/build.gradle.kts
          # [skip ci] prevents this push from re-triggering the workflow
          git commit -m "chore(release): v${{ steps.version.outputs.version }} [skip ci]"
          # Rebase in case main moved while the build ran
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Publish release to public repo
        uses: softprops/action-gh-release@v2
        with:
          repository: MangoDevelopers/vast-browser-release
          token: ${{ secrets.RELEASE_REPO_TOKEN }}
          tag_name: v${{ steps.version.outputs.version }}
          name: "VastBrowser v${{ steps.version.outputs.version }}"
          body: |
            ## VastBrowser v${{ steps.version.outputs.version }}

            **Engine Version:** Mozilla Components ${{ steps.version.outputs.engine }}

            ### Flavors
            - `VastBrowser-*` — regular (system WebView engine, smaller download)
            - `VastBrowser-Pro-*` — pro (bundled GeckoView engine)

            APKs are split per ABI — for most Android TV / Fire TV devices use the
            `arm64-v8a` (newer devices) or `armeabi-v7a` (older devices) APK.

            ### Installation
            1. Download the APK below
            2. Transfer to your Android TV device
            3. Install via file manager or `adb install`

            Verify downloads against `SHA256SUMS.txt`.

            ---
            *Built automatically by GitHub Actions*
          files: dist/*
          draft: false
          prerelease: false
