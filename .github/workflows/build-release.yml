name: Build & Release

on:
  # Trigger on push to main branch (including merged engine-update PRs
  # created by the version-check workflow)
  push:
    branches: [ main ]

  # Manual trigger
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded builds of the same ref
concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & publish signed APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify release credentials are configured
        run: |
          if [ -z "${{ secrets.RELEASE_REPO_TOKEN }}" ]; then
            echo "::error::RELEASE_REPO_TOKEN secret is not set (fine-grained PAT with contents:write on MangoDevelopers/vast-browser-release)"
            exit 1
          fi
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Decode release keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "VAST_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> $GITHUB_ENV

      - name: Grant execute permission to gradlew
        run: chmod +x VastBrowser/gradlew

      - name: Build signed Release APKs
        working-directory: VastBrowser
        env:
          VAST_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VAST_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: ./gradlew assembleRelease

      - name: Collect APKs with stable names
        run: |
          mkdir -p dist
          for f in VastBrowser/vast-browser/build/outputs/apk/release/*.apk; do
            abi=$(basename "$f" | sed -E 's/^vast-browser-(.*)-release\.apk$/\1/')
            cp "$f" "dist/VastBrowser-${abi}.apk"
          done
          for f in VastBrowser/vast-browser-pro/build/outputs/apk/release/*.apk; do
            abi=$(basename "$f" | sed -E 's/^vast-browser-pro-(.*)-release\.apk$/\1/')
            cp "$f" "dist/VastBrowser-Pro-${abi}.apk"
          done
          cd dist && sha256sum *.apk > SHA256SUMS.txt
          ls -la

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: dist/*

      - name: Extract version info
        id: version
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' VastBrowser/vast-browser/build.gradle.kts)
          ENGINE=$(grep -oP 'val mozComponentsVersion = "\K[^"]+' VastBrowser/vast-browser/build.gradle.kts)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "engine=$ENGINE" >> $GITHUB_OUTPUT
          echo "App version: $VERSION, Engine: $ENGINE"

      - name: Publish release to public repo
        uses: softprops/action-gh-release@v2
        with:
          repository: MangoDevelopers/vast-browser-release
          token: ${{ secrets.RELEASE_REPO_TOKEN }}
          tag_name: v${{ steps.version.outputs.version }}-build.${{ github.run_number }}
          name: "VastBrowser v${{ steps.version.outputs.version }} (Build #${{ github.run_number }})"
          body: |
            ## VastBrowser v${{ steps.version.outputs.version }}

            **Engine Version:** Mozilla Components ${{ steps.version.outputs.engine }}

            ### Flavors
            - `VastBrowser-*` — regular (system WebView engine, smaller download)
            - `VastBrowser-Pro-*` — pro (bundled GeckoView engine)

            APKs are split per ABI — for most Android TV / Fire TV devices use the
            `arm64-v8a` (newer devices) or `armeabi-v7a` (older devices) APK.

            ### Installation
            1. Download the APK below
            2. Transfer to your Android TV device
            3. Install via file manager or `adb install`

            Verify downloads against `SHA256SUMS.txt`.

            ---
            *Built automatically by GitHub Actions*
          files: dist/*
          draft: false
          prerelease: false
