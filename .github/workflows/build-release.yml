name: Build & Release

on:
  # Trigger on push to main branch
  push:
    branches: [ main ]
  
  # Manual trigger with optional force release
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Force a new release even if no engine update'
        required: false
        default: 'false'
        type: boolean
  
  # Weekly scheduled check for engine updates
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 6:00 UTC

permissions:
  contents: write

jobs:
  check-engine-update:
    name: Check for Engine Updates
    runs-on: ubuntu-latest
    # Only run on schedule or manual dispatch
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    outputs:
      engine_updated: ${{ steps.check.outputs.updated }}
      new_version: ${{ steps.check.outputs.new_version }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Check latest mozilla-components version
        id: check
        run: |
          # Query Maven for the latest version of browser-engine-system
          MAVEN_URL="https://maven.mozilla.org/maven2/org/mozilla/components/browser-engine-system/maven-metadata.xml"
          LATEST=$(curl -s "$MAVEN_URL" | grep -oP '<latest>\K[^<]+' || echo "")
          
          if [ -z "$LATEST" ]; then
            echo "Could not fetch latest version from Maven"
            echo "updated=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Read current version from build.gradle.kts
          CURRENT=$(grep 'val mozComponentsVersion' VastBrowser/app/build.gradle.kts | grep -oP '"[^"]+"' | tr -d '"')
          
          echo "Current version: $CURRENT"
          echo "Latest version: $LATEST"
          
          if [ "$CURRENT" != "$LATEST" ]; then
            echo "Engine update available: $CURRENT → $LATEST"
            echo "updated=true" >> $GITHUB_OUTPUT
            echo "new_version=$LATEST" >> $GITHUB_OUTPUT
          else
            echo "Already up to date"
            echo "updated=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Update engine version in build.gradle.kts
        if: steps.check.outputs.updated == 'true'
        run: |
          NEW_VERSION="${{ steps.check.outputs.new_version }}"
          sed -i "s/val mozComponentsVersion = \"[^\"]*\"/val mozComponentsVersion = \"$NEW_VERSION\"/" VastBrowser/app/build.gradle.kts
          
          # Verify the change
          grep "mozComponentsVersion" VastBrowser/app/build.gradle.kts
      
      - name: Commit and push engine update
        if: steps.check.outputs.updated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VastBrowser/app/build.gradle.kts
          git commit -m "chore: bump mozilla-components to ${{ steps.check.outputs.new_version }}"
          git push

  build:
    name: Build APKs
    runs-on: ubuntu-latest
    needs: [check-engine-update]
    # Run if: push to main, engine was updated, or force release requested
    if: |
      always() && (
        github.event_name == 'push' ||
        needs.check-engine-update.outputs.engine_updated == 'true' ||
        github.event.inputs.force_release == 'true'
      )
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          # Fetch the latest commit (in case engine was just updated)
          fetch-depth: 0
      
      - name: Pull latest changes
        if: github.event_name != 'push'
        run: git pull origin main || true
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      
      - name: Grant execute permission to gradlew
        run: chmod +x VastBrowser/gradlew
      
      - name: Build Debug APK
        working-directory: VastBrowser
        run: ./gradlew assembleDebug
      
      - name: Build Release APK
        working-directory: VastBrowser
        run: ./gradlew assembleRelease
        continue-on-error: true  # Release may fail without signing config
      
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: VastBrowser/app/build/outputs/apk/debug/app-debug.apk
      
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: release-apk
          path: VastBrowser/app/build/outputs/apk/release/app-release*.apk
          if-no-files-found: ignore
      
      - name: Extract version info
        id: version
        run: |
          VERSION=$(grep 'versionName' VastBrowser/app/build.gradle.kts | grep -oP '"[^"]+"' | tr -d '"')
          ENGINE=$(grep 'val mozComponentsVersion' VastBrowser/app/build.gradle.kts | grep -oP '"[^"]+"' | tr -d '"')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "engine=$ENGINE" >> $GITHUB_OUTPUT
          echo "App version: $VERSION, Engine: $ENGINE"
      
      - name: Create GitHub Release
        if: github.event_name != 'push' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}-build.${{ github.run_number }}
          name: "VastBrowser v${{ steps.version.outputs.version }} (Build #${{ github.run_number }})"
          body: |
            ## VastBrowser v${{ steps.version.outputs.version }}
            
            **Engine Version:** Mozilla Components ${{ steps.version.outputs.engine }}
            
            ### What's New
            - Built from commit ${{ github.sha }}
            ${{ needs.check-engine-update.outputs.engine_updated == 'true' && format('- 🔄 Updated Mozilla Components engine to {0}', needs.check-engine-update.outputs.new_version) || '' }}
            
            ### Installation
            1. Download the APK below
            2. Transfer to your Android TV device
            3. Install via file manager or `adb install`
            
            ---
            *Built automatically by GitHub Actions*
          files: |
            VastBrowser/app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
