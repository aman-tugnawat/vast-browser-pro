name: Build & Release

on:
  # Trigger on push to main branch (including merged engine-update PRs
  # created by the version-check workflow)
  push:
    branches: [ main ]

  # Manual trigger
  workflow_dispatch:

permissions:
  contents: write

# Cancel superseded builds of the same ref
concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission to gradlew
        run: chmod +x VastBrowser/gradlew

      - name: Build Debug APKs
        working-directory: VastBrowser
        run: ./gradlew assembleDebug

      - name: Build Release APKs
        working-directory: VastBrowser
        run: ./gradlew assembleRelease
        continue-on-error: true  # Release may fail without signing config

      - name: Upload Debug APKs (regular)
        uses: actions/upload-artifact@v4
        with:
          name: vast-browser-debug-apk
          path: VastBrowser/vast-browser/build/outputs/apk/debug/*.apk

      - name: Upload Debug APKs (pro)
        uses: actions/upload-artifact@v4
        with:
          name: vast-browser-pro-debug-apk
          path: VastBrowser/vast-browser-pro/build/outputs/apk/debug/*.apk

      - name: Upload Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: |
            VastBrowser/vast-browser/build/outputs/apk/release/*.apk
            VastBrowser/vast-browser-pro/build/outputs/apk/release/*.apk
          if-no-files-found: ignore

      - name: Extract version info
        id: version
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' VastBrowser/vast-browser/build.gradle.kts)
          ENGINE=$(grep -oP 'val mozComponentsVersion = "\K[^"]+' VastBrowser/vast-browser/build.gradle.kts)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "engine=$ENGINE" >> $GITHUB_OUTPUT
          echo "App version: $VERSION, Engine: $ENGINE"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}-build.${{ github.run_number }}
          name: "VastBrowser v${{ steps.version.outputs.version }} (Build #${{ github.run_number }})"
          body: |
            ## VastBrowser v${{ steps.version.outputs.version }}

            **Engine Version:** Mozilla Components ${{ steps.version.outputs.engine }}

            ### Flavors
            - `vast-browser-*` — regular (system WebView engine)
            - `vast-browser-pro-*` — pro (GeckoView engine)

            APKs are split per ABI — for most Android TV devices use the `arm64-v8a` (newer) or `armeabi-v7a` (older) APK.

            ### What's New
            - Built from commit ${{ github.sha }}

            ### Installation
            1. Download the APK below
            2. Transfer to your Android TV device
            3. Install via file manager or `adb install`

            ---
            *Built automatically by GitHub Actions*
          files: |
            VastBrowser/vast-browser/build/outputs/apk/debug/*.apk
            VastBrowser/vast-browser-pro/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
