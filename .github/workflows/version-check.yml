name: Check Engine Version

on:
  # Daily check at noon UTC
  schedule:
    - cron: '0 12 * * *'
  
  # Manual trigger
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check-version:
    name: Check Mozilla Components Version
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Check for newer mozilla-components version
        id: check
        run: |
          # Query Maven for the latest version
          MAVEN_URL="https://maven.mozilla.org/maven2/org/mozilla/components/browser-engine-system/maven-metadata.xml"
          LATEST=$(curl -s "$MAVEN_URL" | grep -oP '<latest>\K[^<]+' || echo "")
          
          if [ -z "$LATEST" ]; then
            echo "Could not fetch latest version from Maven"
            echo "updated=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Read current version from build.gradle.kts
          CURRENT=$(grep 'val mozComponentsVersion' VastBrowser/browser-engine/build.gradle.kts | grep -oP '"[^"]+"' | tr -d '"')
          
          echo "Current: $CURRENT"
          echo "Latest: $LATEST"
          echo "current=$CURRENT" >> $GITHUB_OUTPUT
          echo "latest=$LATEST" >> $GITHUB_OUTPUT
          
          if [ "$CURRENT" != "$LATEST" ]; then
            echo "Update available!"
            echo "updated=true" >> $GITHUB_OUTPUT
          else
            echo "Already up to date."
            echo "updated=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Update version and create PR
        if: steps.check.outputs.updated == 'true'
        run: |
          BRANCH="engine-update/${{ steps.check.outputs.latest }}"
          NEW_VERSION="${{ steps.check.outputs.latest }}"
          OLD_VERSION="${{ steps.check.outputs.current }}"
          
          # Check if branch already exists
          if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null 2>&1; then
            echo "Branch $BRANCH already exists. Skipping."
            exit 0
          fi
          
          # Create new branch
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          
          sed -i "s/val mozComponentsVersion = \"[^\"]*\"/val mozComponentsVersion = \"$NEW_VERSION\"/" VastBrowser/browser-engine/build.gradle.kts
          sed -i "s/val mozComponentsVersion = \"[^\"]*\"/val mozComponentsVersion = \"$NEW_VERSION\"/" VastBrowser/browser-ui-tv/build.gradle.kts
          
          # Verify the change
          grep "mozComponentsVersion" VastBrowser/browser-engine/build.gradle.kts
          
          # Commit and push
          git add VastBrowser/browser-engine/build.gradle.kts VastBrowser/browser-ui-tv/build.gradle.kts
          git commit -m "chore: bump mozilla-components $OLD_VERSION → $NEW_VERSION"
          git push origin "$BRANCH"
          
          # Create PR
          gh pr create \
            --title "🔄 Update Mozilla Components: $OLD_VERSION → $NEW_VERSION" \
            --body "## Engine Update
          
          This PR updates the Mozilla Android Components (browser engine) dependency.
          
          | | Version |
          |---|---|
          | **Current** | \`$OLD_VERSION\` |
          | **New** | \`$NEW_VERSION\` |
          
          ### Changes
          - Updated \`mozComponentsVersion\` in \`VastBrowser/app/build.gradle.kts\`
          
          ### Verification
          - [ ] Build succeeds (\`./gradlew assembleDebug\`)
          - [ ] Basic browsing works on emulator
          - [ ] Plugin injection still functions
          
          ---
          *This PR was automatically created by the version-check workflow.*" \
            --base main \
            --head "$BRANCH" \
            --label "dependencies"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
